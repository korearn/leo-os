<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería | LeOS</title>
  <meta name="description" content="Fotos que Leo toma dentro de los videojuegos.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="subhead">
      <a class="wordmark wordmark--small" href="index.html">LeOS</a>
      <a class="subhead__back" href="index.html">Volver a la memory card</a>
    </header>

    <main class="window" aria-labelledby="g-title">
      <h1 class="window__title" id="g-title">Galería</h1>
      <div class="window__body">
        <p class="window__note">Fotos que tomo dentro de los juegos. Toca una para verla en grande.</p>
        <div class="gallery gallery--full">
          <figure class="shot">
            <a class="shot__frame" href="img/shots/ffx.webp"><img src="img/shots/ffx-mini.webp" alt="Tidus en un muelle frente al mar turquesa" width="640" height="360" loading="lazy"></a>
            <figcaption>Final Fantasy X</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/nms.webp"><img src="img/shots/nms-mini.webp" alt="Viaje por el hiperespacio entre luces violeta y amarillas" width="640" height="360" loading="lazy"></a>
            <figcaption>No Man's Sky</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/nms-saturn.webp"><img src="img/shots/nms-saturn-mini.webp" alt="Cabina de la nave frente a un planeta con anillos" width="640" height="360" loading="lazy"></a>
            <figcaption>No Man's Sky</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/outer-wilds.webp"><img src="img/shots/outer-wilds-mini.webp" alt="Cabina de la nave con notas pegadas en la pared" width="640" height="360" loading="lazy"></a>
            <figcaption>Outer Wilds</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/hollow-night.webp"><img src="img/shots/hollow-night-mini.webp" alt="El Caballero descansa en una banca bajo una luz azul" width="640" height="360" loading="lazy"></a>
            <figcaption>Hollow Knight</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/nitw.webp"><img src="img/shots/nitw-mini.webp" alt="Mae en su cuarto, iluminado de noche" width="640" height="360" loading="lazy"></a>
            <figcaption>Night in the Woods</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/cyber2077-cars.webp"><img src="img/shots/cyber2077-cars-mini.webp" alt="Autos frente a un letrero de neón en Night City, de noche" width="640" height="360" loading="lazy"></a>
            <figcaption>Cyberpunk 2077</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/yakuza0.webp"><img src="img/shots/yakuza0-mini.webp" alt="Calle llena de letreros de neón" width="640" height="360" loading="lazy"></a>
            <figcaption>Yakuza 0</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/ffxv.webp"><img src="img/shots/ffxv-mini.webp" alt="Noctis sentado junto al auto en la carretera" width="640" height="360" loading="lazy"></a>
            <figcaption>Final Fantasy XV</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/dmc5.webp"><img src="img/shots/dmc5-mini.webp" alt="Un personaje mira la ciudad en ruinas al atardecer" width="640" height="360" loading="lazy"></a>
            <figcaption>Devil May Cry 5</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/dxm.webp"><img src="img/shots/dxm-mini.webp" alt="Una máquina gigante bajo un cielo rojo" width="640" height="360" loading="lazy"></a>
            <figcaption>Daemon X Machina</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/mh.webp"><img src="img/shots/mh-mini.webp" alt="Cazador con armadura de plumas y su compañero" width="640" height="360" loading="lazy"></a>
            <figcaption>Monster Hunter Rise</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/wukong.webp"><img src="img/shots/wukong-mini.webp" alt="El protagonista frente a una cascada en el bosque" width="640" height="360" loading="lazy"></a>
            <figcaption>Black Myth: Wukong</figcaption>
          </figure>
          <figure class="shot">
            <a class="shot__frame" href="img/shots/sekiro.webp"><img src="img/shots/sekiro-mini.webp" alt="Dos personajes junto a un campo de juncos, de noche" width="640" height="360" loading="lazy"></a>
            <figcaption>Sekiro</figcaption>
          </figure>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Hecho a mano y alojado en Neocities. Se ve mejor de noche.</p>
    </footer>
  </div>
</body>
</html>
